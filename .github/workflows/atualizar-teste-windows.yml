name: Atualizar teste Windows (manual)

# O push na main já atualiza o teste no workflow "Versão, teste Windows e produção .12".
# Este fica só para rodar o teste local sem mexer na produção.
on:
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: [self-hosted, windows, biweb-win]
    steps:
      - name: Puxar main e reiniciar run_dev
        working-directory: C:\python\BIWEB
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\atualizar_do_github.ps1
